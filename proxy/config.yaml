      # Drop non-standard params to avoid backend errors
      drop_params: true

      # Reasoning effort. Values: none / minimal / low / medium / high / xhigh / max
      reasoning_effort: "ultra"

    model_info:
      # gpt is only reachable via the Responses API (not /chat/completions)
      mode: responses

  - model_name: gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.4-mini
      api_base: os.environ/GATEWAY_BASE_URL
      api_key: os.environ/GATEWAY_API_KEY

      # Drop non-standard params to avoid backend errors
      drop_params: true

      # Supported values are: 'none', 'low', 'medium', 'high', and 'xhigh'.
      reasoning_effort: "xhigh"

    model_info:
      # gpt is only reachable via the Responses API (not /chat/completions)
      mode: responses

  - model_name: codex-auto-review
    litellm_params:
      model: openai/codex-auto-review
      api_base: os.environ/GATEWAY_BASE_URL
      api_key: os.environ/GATEWAY_API_KEY

      # Drop non-standard params to avoid backend errors
      drop_params: true

      # Supported values are: 'none', 'low', 'medium', 'high', and 'xhigh'.
      reasoning_effort: "xhigh"

    model_info:
      # gpt is only reachable via the Responses API (not /chat/completions)
      mode: responses
