model_list:
  - model_name: deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-v4-flash-0731
      api_base: os.environ/GATEWAY_BASE_URL
      api_key: os.environ/GATEWAY_API_KEY

      # Drop non-standard params to avoid backend errors
      drop_params: true

    model_info:
      mode: responses

  - model_name: deepseek-v4-pro
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: os.environ/GATEWAY_BASE_URL
      api_key: os.environ/GATEWAY_API_KEY

      # Drop non-standard params to avoid backend errors
      drop_params: true

    model_info:
      mode: responses

  - model_name: gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_base: os.environ/GATEWAY_BASE_URL
      api_key: os.environ/GATEWAY_API_KEY

      # Drop non-standard params to avoid backend errors
      drop_params: true

      # Reasoning effort. Values: none / minimal / low / medium / high / xhigh / max
      reasoning_effort: "ultra"

    model_info:
      # gpt is only reachable via the Responses API (not /chat/completions)
      mode: responses

  - model_name: gpt-5.6-terra
    litellm_params:
      model: openai/gpt-5.6-terra
      api_base: os.environ/GATEWAY_BASE_URL
